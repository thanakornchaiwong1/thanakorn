# ============================================================
#  Gold Trading Bot — Action Masked Sniper (M15)
#  Rule-based filter: only allow entry when trend+zone+session align
#  Agent learns WHICH valid setups to take, not WHEN to trade
# ============================================================

data:
  source: "csv"
  symbol: "XAUUSD.iux"
  interval: "15m"
  period: null
  csv_path: "./data/xauusd_m15.csv"
  csv_daily_path: null           # D1 disabled — using H1 (timelier for M15 scalping)
  train_test_split: 0.8
  use_multi_timeframe: true
  use_h1_from_m15: true          # Resample M15→H1 for trend signal (replaces D1)

env:
  initial_balance: 10000.0
  lot_size: 0.01
  spread: 0.16
  commission: 0.07
  contract_size: 100.0
  max_position: 1
  window_size: 20                    # proven best: 20 features x20 +3 = ~563 dims
  reward_type: "masked_sniper"        # clean outcome-based reward
  max_drawdown_pct: 0.5
  trade_cooldown: 0
  sl_atr_mult: 1.5
  tp_atr_mult: 4.5                    # RR 1:3
  use_lstm: false
  # Action masking
  use_action_mask: true               # THE key change
  mask_trend_threshold: 0.03         # H1 trend: 0.03 = ~44% raw / ~25% after 4-bar MA (calibrated for H1 scale)
  mask_zone_threshold: 1.5           # ds_distance < 1.5 (proven best)
  mask_require_session: false        # session is reward bonus, not hard requirement

ppo:
  policy: "MlpPolicy"
  learning_rate: 3.0e-4
  n_steps: 4096
  batch_size: 128
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  lstm_hidden_size: 128
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

train:
  total_timesteps: 500000
  n_envs: 4
  seed: 42
  eval_freq: 20000
  n_eval_episodes: 5
  checkpoint_freq: 100000
  use_vec_normalize: true

paths:
  tensorboard_log: "./logs/ppo_gold_scalp/"
  checkpoint_dir: "./checkpoints_scalp/"
  best_model_dir: "./checkpoints_scalp/best/"
  vecnormalize_path: "./checkpoints_scalp/vec_normalize.pkl"
  data_cache: "./data/xauusd_m15_cache.csv"
