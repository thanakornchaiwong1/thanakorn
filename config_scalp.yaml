# ============================================================
#  Gold Trading Bot — Scalping Config (M15)
#  v6: FVG + D/S zones combined, anti-overtrade entry cost
#  Best architecture (MLP) + best SL/TP (1.5/4.5 = RR 1:3)
# ============================================================

data:
  source: "csv"
  symbol: "XAUUSD.iux"
  interval: "15m"
  period: null
  csv_path: "./data/xauusd_m15.csv"
  csv_daily_path: "./data/xauusd_d1.csv"
  train_test_split: 0.8
  use_multi_timeframe: true

env:
  initial_balance: 10000.0
  lot_size: 0.01
  spread: 0.16
  commission: 0.07
  contract_size: 100.0
  max_position: 1
  window_size: 20                    # reduced from 30 (fewer dims for more features)
  reward_type: "scalp_sniper_v6"     # v6: anti-overtrade + FVG + D/S combined
  max_drawdown_pct: 0.5
  trade_cooldown: 0
  sl_atr_mult: 1.5                   # proven best from walk-forward
  tp_atr_mult: 4.5                   # RR 1:3 (proven best)
  use_lstm: false

ppo:
  policy: "MlpPolicy"
  learning_rate: 3.0e-4
  n_steps: 4096
  batch_size: 128
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  lstm_hidden_size: 128
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

train:
  total_timesteps: 500000
  n_envs: 4
  seed: 42
  eval_freq: 20000
  n_eval_episodes: 5
  checkpoint_freq: 100000
  use_vec_normalize: true

paths:
  tensorboard_log: "./logs/ppo_gold_scalp/"
  checkpoint_dir: "./checkpoints_scalp/"
  best_model_dir: "./checkpoints_scalp/best/"
  vecnormalize_path: "./checkpoints_scalp/vec_normalize.pkl"
  data_cache: "./data/xauusd_m15_cache.csv"
