# ============================================================
#  Gold Trading Bot — Master Config
#  แก้ไขที่นี่ที่เดียว ใช้กับ data.py / env.py / train.py / backtest.py
# ============================================================

data:
  # โหลดจาก yfinance (ไม่ต้องสมัคร) หรือใส่ csv_path ถ้ามีไฟล์เอง
  source: "yfinance"           # "yfinance" | "csv"
  symbol: "GC=F"               # gold futures (continuous)
  interval: "4h"               # 1h | 4h | 1d
  period: "2y"                 # ระยะเวลาที่ดึง (yfinance format)
  csv_path: null               # ถ้า source=csv: path ไป CSV ที่มี columns: open, high, low, close, volume
  train_test_split: 0.8        # 80% train / 20% test (split ตามเวลา ห้าม random!)
  use_multi_timeframe: true

env:
  initial_balance: 10000.0
  lot_size: 0.01               # mini lot (0.01 lot = 1 oz XAUUSD)
  spread: 0.30                 # ค่า spread retail broker (USD)
  commission: 0.07             # commission ต่อ trade (USD)
  contract_size: 100.0         # XAUUSD: 100 oz / standard lot
  max_position: 1
  window_size: 20              # จำนวน candles ที่ agent เห็นใน observation
  reward_type: "differential_sharpe"  # pnl | sharpe | differential_sharpe | multi_objective | trend_aware
  max_drawdown_pct: 0.5        # หยุด episode ถ้า drawdown เกิน 50%

ppo:
  policy: "MlpPolicy"
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01               # เพิ่มเป็น 0.02-0.05 ถ้า agent ไม่เทรดเลย
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

train:
  total_timesteps: 500000
  n_envs: 4                    # parallel envs (DummyVecEnv)
  seed: 42
  eval_freq: 10000             # eval ทุก N steps
  n_eval_episodes: 5
  checkpoint_freq: 50000
  use_vec_normalize: true      # normalize obs + reward (สำคัญ!)

paths:
  tensorboard_log: "./logs/ppo_gold/"
  checkpoint_dir: "./checkpoints/"
  best_model_dir: "./checkpoints/best/"
  vecnormalize_path: "./checkpoints/vec_normalize.pkl"
  data_cache: "./data/xauusd.csv"
